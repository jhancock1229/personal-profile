apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: personal-profile
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: profile.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: personal-profile
            port:
              number: 80

